name: Build RG Precision Drive

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: |
          cmake --build build --config Release --target RG_Precision_Drive_VST3 --parallel

      - name: Find VST3
        shell: pwsh
        run: |
          Write-Host "Searching for VST3..."
          Get-ChildItem -Path build -Recurse -Filter "*.vst3" |
            Select-Object -ExpandProperty FullName

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: RG-Precision-Drive-VST3
          path: |
            build/**/*.vst3
          if-no-files-found: error
